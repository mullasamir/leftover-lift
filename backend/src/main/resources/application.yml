spring:
  application:
    name: leftoverlift
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leftoverlift}
    username: ${DB_USER:leftoverlift}
    password: ${DB_PASSWORD:leftoverlift}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    # Base64 encoded, at least 256 bits. Generate: openssl rand -base64 48
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1iZWZvcmUtZGVwbG95aW5nLTAxMjM0NTY3ODk=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
