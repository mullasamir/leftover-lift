services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leftoverlift
      POSTGRES_USER: leftoverlift
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leftoverlift}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leftoverlift"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/leftoverlift
      DB_USER: leftoverlift
      DB_PASSWORD: ${DB_PASSWORD:-leftoverlift}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    profiles: ["full"]   # `docker compose --profile full up` runs the API in a container too

volumes:
  pgdata:
