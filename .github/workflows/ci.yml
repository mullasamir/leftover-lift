name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      # A throwaway PostgreSQL for the tests. Its database is named like the one the concurrency test
      # expects, so that test runs here too (it skips itself on machines without it).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leftoverlift
          POSTGRES_PASSWORD: leftoverlift
          POSTGRES_DB: leftoverlift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leftoverlift -d leftoverlift_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run tests
        run: mvn -B verify
      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build
        run: npm run build

  images:
    name: Build and publish images
    needs: [backend, frontend]
    # Only after the checks pass, and only for code that has reached main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Registry names must be lowercase.
      - name: Work out the image owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/leftover-lift-api:latest
            ghcr.io/${{ env.OWNER }}/leftover-lift-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push the web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/leftover-lift-web:latest
            ghcr.io/${{ env.OWNER }}/leftover-lift-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
